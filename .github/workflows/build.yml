name: Build, Push and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

###############################################################################
# Build Docker Images
###############################################################################

  build-images:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        app:
          - auth
          - weather
          - ui

    steps:

      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: |
            husseinbadran/${{ matrix.app }}:latest
            husseinbadran/${{ matrix.app }}:${{ env.SHORT_SHA }}

###############################################################################
# Update Kubernetes manifests
###############################################################################

  update-manifests:

    needs: build-images

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Deployment Manifests
        run: |

          sed -i "s|image: husseinbadran/auth:.*|image: husseinbadran/auth:${SHORT_SHA}|g" \
            base/kubernetes/auth/deployment.yaml

          sed -i "s|image: husseinbadran/weather:.*|image: husseinbadran/weather:${SHORT_SHA}|g" \
            base/kubernetes/weather/deployment.yaml

          sed -i "s|image: husseinbadran/ui:.*|image: husseinbadran/ui:${SHORT_SHA}|g" \
            base/kubernetes/ui/deployment.yaml

      - name: Show Changes
        run: git diff

      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add base/kubernetes

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "Update images to ${SHORT_SHA}"
          git push