apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init-script
  annotations:
    argocd.argoproj.io/sync-wave: "-1"

data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS weatherapp;
    CREATE USER 'authuser'@'%' IDENTIFIED BY 'my-secret-pw';
    GRANT ALL PRIVILEGES ON weatherapp.* TO 'authuser'@'%';
    FLUSH PRIVILEGES;